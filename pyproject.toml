[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcdl-optimizer"
version = "0.3.0"
description = "Reusable two-stage load-directrix and ideal-storage declared-set robust correction for radial networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "gurobipy>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["lcdl_algorithm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
